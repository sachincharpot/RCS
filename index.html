        if (["મહિલાઓની બચત અને અથવા ધિરાણ સહકારી મંડળી", "અન્ય બચત સહકારી મંડળી", "શરાફી સહકારી મંડળી", "પગારદાર કર્મચારીઓની શરાફી સહકારી મંડળી", "કર્મચારીઓની ધિરાણ મંડળી"].includes(s)) return "G3";

        if (["પ્રાથમિક મજુર કામદાર સહકારી મંડળી", "ખેતી કામદારોની સહકારી મંડળી", "જંગલ કામદાર સહકારી મંડળી"].includes(s)) return "G5";

        return "G9";

                  <tr><td className="border p-2 text-center">2</td><td className="border p-2">Type of Society</td><td className="border p-2">{formA.type || "-"}</td></tr>
                  <tr><td className="border p-2 text-center">3</td><td className="border p-2">Society Type Detail (Sub Type)</td><td className="border p-2">{formA.subType || "-"}</td></tr>
                  <tr><td className="border p-2 text-center">4</td><td className="border p-2">Address of the Society</td><td className="border p-2">{fullAddress || "-"}</td></tr>
                  <tr><td className="border p-2 text-center">5</td><td className="border p-2">Area of Operation</td><td className="border p-2">{formA.area || "-"}</td></tr>
                  <tr><td className="border p-2 text-center">6</td><td className="border p-2">Accumulated Share Capital</td><td className="border p-2">{formA.accShareCapital ? `₹ ${formA.accShareCapital}` : "-"}</td></tr>
                  <tr><td className="border p-2 text-center">7</td><td className="border p-2">ByLaws (PDF Document)</td><td className="border p-2">{formA.bylawsPdfName || "PDF Document (Pending Upload)"}</td></tr>
                </tbody>
              </table>
            </div>

            {/* Submit Buttons */}
            <div className="flex justify-end gap-3 pt-4 border-t">
              <button type="submit" className="bg-slate-900 text-white px-6 py-2.5 rounded text-sm font-medium hover:bg-slate-800">
                Submit Registration Application / અરજી સબમિટ કરો
              </button>
            </div>

          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
